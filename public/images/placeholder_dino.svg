<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e1d"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#030813"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tekGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0e7490" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <rect width="400" height="400" fill="url(#tekGrid)"/>
  <circle cx="200" cy="200" r="160" fill="url(#glow)"/>

  <!-- Tek Hologram Border Ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>

  <!-- Corner Brackets -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <path d="M 370 50 L 370 30 L 350 30" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <path d="M 30 350 L 30 370 L 50 370" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <path d="M 370 350 L 370 370 L 350 370" fill="none" stroke="#22d3ee" stroke-width="2"/>

  <!-- Dinosaur Silhouette Motif -->
  <g transform="translate(110, 110) scale(0.9)" fill="url(#cyanGrad)">
    <!-- Stylized Rex / Raptor Silhouette -->
    <path d="M 170 30 C 145 25, 120 40, 100 60 C 80 50, 60 55, 45 70 C 35 80, 20 90, 10 95 C 15 105, 30 110, 45 105 C 50 115, 60 120, 75 115 C 85 130, 95 150, 100 170 L 85 180 L 105 185 L 115 170 C 130 180, 145 175, 155 160 C 170 145, 185 120, 195 90 C 200 70, 190 40, 170 30 Z" opacity="0.9"/>
    <!-- Tail & Legs -->
    <path d="M 100 170 C 80 185, 55 195, 30 198 C 45 190, 65 180, 85 165 Z" fill="#06b6d4" opacity="0.8"/>
  </g>

  <!-- Scanner HUD Lines -->
  <line x1="80" y1="200" x2="320" y2="200" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.7" stroke-dasharray="12 6"/>
  
  <!-- Text Badges -->
  <text x="200" y="295" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="3">
    [DOSSIER ENCRYPTED]
  </text>
  <text x="200" y="318" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">
    ASSET PENDING CLOUD SYNC
  </text>
  <text x="200" y="335" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="9" opacity="0.8">
    ARK ASCENDED SURVIVAL SPECIMEN
  </text>
</svg>
